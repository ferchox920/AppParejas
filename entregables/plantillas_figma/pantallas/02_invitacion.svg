<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><defs><linearGradient id="semilla" x1="0" y1="0" x2="1" y2=".8"><stop offset="0" stop-color="#C5A981"/><stop offset=".5" stop-color="#AC8966"/><stop offset="1" stop-color="#795E48"/></linearGradient></defs><rect id="" x="0" y="0" width="390" height="844" rx="28" fill="#FAF7F1"/><text x="24" y="29" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#23352B">9:41</text><path d="M314 24v-4 M320 24v-7 M326 24v-10" stroke="#23352B" stroke-width="3" stroke-linecap="round"/><rect id="" x="338" y="15" width="25" height="12" rx="4" fill="none" stroke="#23352B" stroke-width="1"/><rect id="" x="341" y="18" width="17" height="6" rx="2" fill="#23352B"/><text x="195" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#59665C">Nuestro vínculo</text><path d="M36 55l-8 8 8 8" fill="none" stroke="#23352B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#254C3B">EMPEZAR JUNTOS</text><text x="24" y="148" font-family="Georgia, serif" font-size="31" font-weight="400" text-anchor="start" fill="#23352B">Invitá a tu pareja</text><text x="24" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#59665C">Cada persona elige desde su propia cuenta.</text><rect id="" x="24" y="262" width="342" height="103" rx="18" fill="#FFFFFF" stroke="#D6DDD2" stroke-width="1"/><text x="42" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#23352B">Un espacio compartido</text><text x="42" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#59665C">Compartí la invitación por el medio que</text><text x="