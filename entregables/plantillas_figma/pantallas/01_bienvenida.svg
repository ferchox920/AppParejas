<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><defs><linearGradient id="semilla" x1="0" y1="0" x2="1" y2=".8"><stop offset="0" stop-color="#C5A981"/><stop offset=".5" stop-color="#AC8966"/><stop offset="1" stop-color="#795E48"/></linearGradient></defs><rect id="" x="0" y="0" width="390" height="844" rx="28" fill="#FAF7F1"/><text x="24" y="29" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#23352B">9:41</text><path d="M314 24v-4 M320 24v-7 M326 24v-10" stroke="#23352B" stroke-width="3" stroke-linecap="round"/><rect id="" x="338" y="15" width="25" height="12" rx="4" fill="none" stroke="#23352B" stroke-width="1"/><rect id="" x="341" y="18" width="17" height="6" rx="2" fill="#23352B"/><text x="195" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#59665C">AppParejas</text><text x="24" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#254C3B">CULTIVAR ENTRE DOS</text><text x="24" y="148" font-family="Georgia, serif" font-size="31" font-weight="400" text-anchor="start" fill="#23352B">Una semilla para</text><text x="24" y="184" font-family="Georgia, serif" font-size="31" font-weight="400" text-anchor="start" fill="#23352B">ustedes</text><text x="24" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#59665C">Elijan lo que quieren cultivar y denle una</text><text x="24" y="241" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#59665C">forma propia.</text><g id="Referencia-visual-jardin" transform="translate(0 252)"><rect id="" x="24" y="0" width="342" height="245" rx="26" fill="#EAF0E4"/><ellipse cx="195" cy="203" rx="104" ry="15" fill="#CDD9C5"/><path d="M86 178 Q195 140 304 178 L290 205 Q195 238 100 205Z" fill="#DDBB9F"/><ellipse cx="195" cy="177" rx="109" ry="29" fill="#EFDBC4"/><g transform="translate(195 116) rotate(-19)"><ellipse cx="0" cy="0" rx="37" ry="54" fill="url(#semilla)"/><path d="M-15 -40 Q16 -7 12 43" fill="none" stroke="#EAD1AB" stroke-width="3"/><path d="M-26 -14 Q0 -1 28 -14 M-30 4 Q0 18 31 5" stroke="#A48765" stroke-width="2" fill="none"/><ellipse cx="-15" cy="-27" rx="7" ry="14" fill="#EEDDC0" opacity=".55"/><circle cx="-14" cy="17" r="3" fill="#EDBE9A"/><circle cx="19" cy="-23" r="3" fill="#F6E4C8"/></g></g><text x="34" y="544" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23352B">Cada persona aporta algo distinto. La</text><text x="34" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23352B">semilla reúne ambas elecciones.</text><text x="34" y="619" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#59665C">A su ritmo, sin puntajes ni rachas.</text><text x="195" y="715" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#254C3B">¿Ya tenés una cuenta? Iniciar sesión</text><rect id="" x="24" y="748" width="342" height="56" rx="18" fill="#254C3B"/><text x="195.0" y="783" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#FFFFFF">Crear mi cuenta</text><rect id="" x="137" y="830" width="116" height="4" rx="2" fill="#23352B"/></svg>