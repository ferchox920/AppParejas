<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><defs><linearGradient id="semilla" x1="0" y1="0" x2="1" y2=".8"><stop offset="0" stop-color="#C5A981"/><stop offset=".5" stop-color="#AC8966"/><stop offset="1" stop-color="#795E48"/></linearGradient></defs><rect id="" x="0" y="0" width="390" height="844" rx="28" fill="#FAF7F1"/><text x="24" y="29" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#23352B">9:41</text><path d="M314 24v-4 M320 24v-7 M326 24v-10" stroke="#23352B" stroke-width="3" stroke-linecap="round"/><rect id="" x="338" y="15" width="25" height="12" rx="4" fill="none" stroke="#23352B" stroke-width="1"/><rect id="" x="341" y="18" width="17" height="6" rx="2" fill="#23352B"/><text x="195" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#59665C">Elegir  ·  1 de 4</text><path d="M36 55l-8 8 8 8" fill="none" stroke="#23352B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#254C3B">TU ELECCIÓN ESTÁ LISTA</text><text x="24" y="148" font-family="Georgia, serif" font-size="31" font-weight="400" text-anchor="start" fill="#23352B">Un momento para cada</text><text x="24" y="184" font-family="Georgia, serif" font-size="31" font-weight="400" text-anchor="start" fill="#23352B">uno</text><text x="24" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#59665C">Van a ver las elecciones cuando ambos</text><text x="24" y="241" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#59665C">decidan compartirlas.</text><rect id="" x="24" y="270" width="342" height="142" rx="22" fill="#E3EBDD"/><rect id="" x="44" y="291" width="24" height="24" rx="8" fill="#254C3B"/><path d="M50 303 l4 4 8 -9" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="81" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#23352B">Tu aporte está listo</text><text x="44" y="349" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#23352B">Cariño · Respeto</text><text x="44" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#23352B">Paciencia · Escucha</text><rect id="" x="24" y="442" width="342" height="123" rx="18" fill="#FFFFFF" stroke="#D6DDD2" stroke-width="1"/><text x="42" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#23352B">Esperando a tu pareja</text><text x="42" y="495" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#59665C">Puede elegir y compartir cuando quiera. No</text><text x="42" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#59665C">hace falta estar conectados a la vez.</text><text x="24" y="609" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#59665C">Mientras tanto, podés revisar tu elección.</text><rect id="" x="24" y="748" width="342" height="56" rx="18" fill="#FAF7F1" stroke="#D6DDD2" stroke-width="1"/><text x="195.0" y="783" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#254C3B">Revisar mi elección</text><rect id="" x="137" y="830" width="116" height="4" rx="2" fill="#23352B"/></svg>