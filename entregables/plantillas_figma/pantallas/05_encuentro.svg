 x="24" y="294" width="93" height="34" rx="17" fill="#254C3B"/><text x="70.5" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">Respeto</text><rect id="" x="127" y="294" width="109" height="34" rx="17" fill="#254C3B"/><text x="181.5" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">Paciencia</text><rect id="" x="24" y="354" width="342" height="83" rx="18" fill="#FFFFFF" stroke="#D6DDD2" stroke-width="1"/><text x="42" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#23352B">Tu aporte</text><text x="42" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#59665C">También elegiste cariño y escucha.</text><rect id="" x="24" y="454" width="342" height="103" rx="18" fill="#FFFFFF" stroke="#D6DDD2" stroke-width="1"/><text x="42" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#23352B">El aporte de tu pareja</text><text x="42" y="507" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#59665C">También eligió calidez, juego y gratitud.</text><rect id="" x="24" y="587" width="342" height="102" rx="20" fill="#E3EBDD"/><text x="42" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#23352B">¿Qué significa para cada uno cultivar</text><text x="42" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#23352B">estas cualidades?</text><rect id="" x="24" y="748" width="342" height="56" rx="18" fill="#254C3B"/><text x="195.0" y="783" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#FFFFFF">Ver nuestra semilla</text><rect id="" x="137" y="830" width="116" hei